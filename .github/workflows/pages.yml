# Тестовая копия сайта на GitHub Pages закрыта 28.10.2026: боевой сайт — signeddxb.com.
# На GitHub Pages теперь лежит только переадресация (.github/pages-redirect):
# любая старая ссылка aevkone.github.io/signup-dxb/... ведёт на ту же страницу signeddxb.com.
name: Переадресация GitHub Pages на signeddxb.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .github/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
